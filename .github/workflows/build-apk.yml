name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # پروژه با Unity 2017.1.1p4 ساخته شده ولی GameCI برای این نسخه ایمیج داکر ندارد.
  # پس Unity پروژه را هنگام بیلد به این نسخه ارتقا می‌دهد.
  # اگر بیلد با خطای کامپایل شکست خورد، به‌جای این 2018.4.36f1 را امتحان کنید.
  BUILD_UNITY_VERSION: 2019.4.40f1

jobs:
  build:
    name: Build Unity Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. آزاد کردن فضای دیسک (ایمیج Unity اندروید حجیم است)
      - name: آزاد کردن فضای دیسک
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 2. دریافت پروژه
      - name: دریافت پروژه
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      # 3. نمایش نسخه اصلی پروژه
      - name: نسخه Unity پروژه
        shell: bash
        run: |
          cat ProjectSettings/ProjectVersion.txt
          echo "Build Unity version: $BUILD_UNITY_VERSION"

      # 4. پاکسازی کش (Library و obj نباید در گیت باشند)
      - name: پاکسازی Cache های Unity
        shell: bash
        run: |
          rm -rf Library Temp obj
          echo "Cleaned."

      # 5. ساخت APK
      - name: ساخت APK با Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # به‌جای auto، نسخه‌ای که ایمیج داکر دارد
          unityVersion: ${{ env.BUILD_UNITY_VERSION }}
          targetPlatform: Android
          versioning: None
          # چون پوشه obj که در گیت بوده پاک شده، شاخه dirty حساب می‌شود
          allowDirtyBuild: true
          androidExportType: androidPackage
          androidSymbolType: none
          # اجرای خودکار API Updater برای اسکریپت‌های قدیمی 2017
          customParameters: -accept-apiupdate
          buildsPath: build

      # 6. بررسی خروجی
      - name: پیدا کردن APK
        shell: bash
        run: |
          find build -type f -name "*.apk" -print
          COUNT=$(find build -type f -name "*.apk" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: APK ساخته نشد"
            exit 1
          fi

      # 7. آپلود APK
      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/**/*.apk
          if-no-files-found: error
