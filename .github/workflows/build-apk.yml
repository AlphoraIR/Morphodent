name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Unity 2017 Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # آزاد کردن فضای دیسک
      # =========================================================
      - name: آزاد کردن فضای دیسک
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      # =========================================================
      # دریافت پروژه
      # =========================================================
      - name: دریافت پروژه
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true


      # =========================================================
      # بررسی ساختار پروژه
      # =========================================================
      - name: بررسی پروژه Unity
        shell: bash
        run: |
          echo "=========================================="
          echo " Unity Project"
          echo "=========================================="

          echo ""
          echo "ProjectVersion:"
          if [ -f "ProjectSettings/ProjectVersion.txt" ]; then
            cat ProjectSettings/ProjectVersion.txt
          else
            echo "ERROR: ProjectVersion.txt پیدا نشد."
            exit 1
          fi

          echo ""
          echo "Assets:"
          if [ -d "Assets" ]; then
            echo "OK: Assets موجود است."
          else
            echo "ERROR: Assets پیدا نشد."
            exit 1
          fi

          echo ""
          echo "ProjectSettings:"
          if [ -d "ProjectSettings" ]; then
            echo "OK: ProjectSettings موجود است."
          else
            echo "ERROR: ProjectSettings پیدا نشد."
            exit 1
          fi

          echo ""
          echo "Packages:"
          if [ -d "Packages" ]; then
            ls -la Packages || true
          else
            echo "این پروژه Package Manager جدید ندارد."
            echo "Unity 2017 Legacy Project detected."
          fi


      # =========================================================
      # حذف فایل های تولیدی قدیمی
      #
      # پروژه های قدیمی Unity ممکن است Library را Commit کرده باشند.
      # برای CI بهتر است Unity آن را دوباره بسازد.
      # =========================================================
      - name: پاکسازی فایل های Unity
        shell: bash
        run: |
          echo "=========================================="
          echo " Cleaning Unity generated folders"
          echo "=========================================="

          rm -rf Library
          rm -rf Temp
          rm -rf obj

          echo ""
          echo "Library / Temp / obj پاک شدند."


      # =========================================================
      # ساخت APK
      #
      # نسخه Unity از ProjectVersion.txt خوانده می شود.
      # پروژه تو:
      #
      # 2017.1.1p4
      #
      # =========================================================
      - name: ساخت APK با Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:
          unityVersion: auto
          targetPlatform: Android
          buildMethod: BuildScript.Build


      # =========================================================
      # پیدا کردن APK
      # =========================================================
      - name: پیدا کردن APK
        shell: bash
        run: |
          echo "=========================================="
          echo " Searching APK"
          echo "=========================================="

          echo ""
          echo "تمام فایل های APK:"
          find . -type f -name "*.apk" -print || true

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo ""
          echo "تعداد APK: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "=========================================="
            echo " ERROR: APK ساخته نشد"
            echo "=========================================="
            exit 1
          fi

          echo ""
          echo "APK پیدا شد."


      # =========================================================
      # آپلود APK
      # =========================================================
      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: خروجی-اندروید
          path: "**/*.apk"
          if-no-files-found: error
